<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#8b5cf6" stop-opacity="1"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03"/>
      <circle cx="30" cy="30" r="0.75" fill="#6366f1" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <style>
    .name-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .role-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #94a3b8;
    }
    .bio-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13.5px;
      font-weight: 400;
      letter-spacing: 0.1px;
      fill: #64748b;
    }
    .tag-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #a5b4fc;
    }
    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="240" rx="14" fill="url(#bg-grad)"/>

  <!-- Grid Overlay -->
  <rect width="900" height="240" rx="14" fill="url(#grid-pattern)"/>

  <!-- Subtle Outer Border -->
  <rect width="898" height="238" x="1" y="1" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Top Accent Beam -->
  <path d="M 40 2 L 860 2" stroke="url(#accent-grad)" stroke-width="2.5" stroke-linecap="round" filter="url(#subtle-glow)"/>

  <!-- Status Chip (Top Right) -->
  <g transform="translate(640, 28)">
    <rect width="215" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="16" cy="14" r="4.5" fill="#10b981" class="pulse-dot"/>
    <text x="29" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500">Available for Architecture</text>
  </g>

  <!-- Main Content Block -->
  <g transform="translate(50, 72)">
    <!-- Main Title -->
    <text x="0" y="32" class="name-text">Deepak Jadhav</text>

    <!-- Subtitle / Role -->
    <text x="0" y="66" class="role-text">Systems &amp; AI Engineer <tspan fill="#6366f1">•</tspan> Autonomous Architectures</text>

    <!-- Bio / Elevator Pitch -->
    <text x="0" y="98" class="bio-text">Architecting local-first computational engines, agentic intelligence swarms &amp; multimodal neural pipelines.</text>

    <!-- Focus Tags -->
    <g transform="translate(0, 120)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="138" height="22" rx="4" fill="#1e1b4b" fill-opacity="0.6" stroke="#4338ca" stroke-width="0.8"/>
      <text x="10" y="15" class="tag-text">#AUTONOMOUS-AI</text>

      <!-- Tag 2 -->
      <rect x="146" y="0" width="128" height="22" rx="4" fill="#0c4a6e" fill-opacity="0.6" stroke="#0284c7" stroke-width="0.8"/>
      <text x="156" y="15" class="tag-text" fill="#38bdf8">#LOCAL-FIRST</text>

      <!-- Tag 3 -->
      <rect x="282" y="0" width="148" height="22" rx="4" fill="#143126" fill-opacity="0.6" stroke="#059669" stroke-width="0.8"/>
      <text x="292" y="15" class="tag-text" fill="#34d399">#MULTIMODAL-DAG</text>

      <!-- Tag 4 -->
      <rect x="438" y="0" width="128" height="22" rx="4" fill="#2d1537" fill-opacity="0.6" stroke="#a21caf" stroke-width="0.8"/>
      <text x="448" y="15" class="tag-text" fill="#f472b6">#SPATIAL-WEBGL</text>
    </g>
  </g>

  <!-- Decorative Accent Dot Pattern on Right -->
  <g transform="translate(810, 110)" opacity="0.4">
    <circle cx="0" cy="0" r="2" fill="#6366f1"/>
    <circle cx="20" cy="0" r="2" fill="#6366f1"/>
    <circle cx="40" cy="0" r="2" fill="#6366f1"/>
    <circle cx="0" cy="20" r="2" fill="#6366f1"/>
    <circle cx="20" cy="20" r="2" fill="#8b5cf6"/>
    <circle cx="40" cy="20" r="2" fill="#06b6d4"/>
    <circle cx="0" cy="40" r="2" fill="#6366f1"/>
    <circle cx="20" cy="40" r="2" fill="#06b6d4"/>
    <circle cx="40" cy="40" r="2" fill="#10b981"/>
  </g>
</svg>
