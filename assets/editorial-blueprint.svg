<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <!-- Dark Architectural Canvas Background -->
    <linearGradient id="blueprint-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Subtle Technical Grid -->
    <pattern id="arch-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22272e" stroke-width="0.5"/>
    </pattern>

    <!-- Phosphor Accent -->
    <linearGradient id="phosphor-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <style>
    .mono-meta {
      font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Courier New', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1.5px;
      fill: #6e7681;
    }
    .mono-accent {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.2px;
      fill: #10b981;
    }
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.8px;
      fill: #f0f6fc;
    }
    .role-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 1.2px;
      fill: #8b949e;
    }
    .node-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 600;
      fill: #c9d1d9;
    }
  </style>

  <!-- Background Base & Grid -->
  <rect width="920" height="220" rx="8" fill="url(#blueprint-bg)"/>
  <rect width="920" height="220" rx="8" fill="url(#arch-grid)"/>

  <!-- Border Perimeter (Hairline Architectural Stroke) -->
  <rect width="918" height="218" x="1" y="1" rx="7" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Top Technical Ruler Strip -->
  <line x1="30" y1="20" x2="890" y2="20" stroke="#21262d" stroke-width="1"/>
  <!-- Ruler calibration ticks -->
  <line x1="30" y1="16" x2="30" y2="24" stroke="#484f58" stroke-width="1"/>
  <line x1="120" y1="18" x2="120" y2="22" stroke="#30363d" stroke-width="1"/>
  <line x1="210" y1="18" x2="210" y2="22" stroke="#30363d" stroke-width="1"/>
  <line x1="300" y1="18" x2="300" y2="22" stroke="#30363d" stroke-width="1"/>
  <line x1="460" y1="16" x2="460" y2="24" stroke="#484f58" stroke-width="1"/>
  <line x1="600" y1="18" x2="600" y2="22" stroke="#30363d" stroke-width="1"/>
  <line x1="750" y1="18" x2="750" y2="22" stroke="#30363d" stroke-width="1"/>
  <line x1="890" y1="16" x2="890" y2="24" stroke="#484f58" stroke-width="1"/>

  <!-- Left Header Section -->
  <g transform="translate(42, 54)">
    <!-- Meta System Callout -->
    <text x="0" y="12" class="mono-meta">ARCH // SPEC-2026.10 · SYSTEMS &amp; DISTRIBUTED DAGs</text>

    <!-- Name Heading -->
    <text x="0" y="52" class="name-title">Deepak Jadhav</text>

    <!-- Role / Discipline -->
    <text x="0" y="78" class="role-sub">Systems &amp; AI Engineer <tspan fill="#30363d">|</tspan> <tspan fill="#10b981">Local-First Software</tspan></text>

    <!-- Compact Mission Statement -->
    <text x="0" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#8b949e" letter-spacing="0.1px">
      Building deterministic agent loops, living state machines, and high-throughput pipelines.
    </text>

    <!-- Technical Status Indicator -->
    <g transform="translate(0, 126)">
      <circle cx="5" cy="5" r="3.5" fill="#10b981"/>
      <circle cx="5" cy="5" r="5.5" fill="none" stroke="#10b981" stroke-width="0.8" opacity="0.6"/>
      <text x="18" y="9" class="mono-accent">RUNTIME: DETERMINISTIC · SYSTEM ACTIVE</text>
    </g>
  </g>

  <!-- Right Schematic Blueprint DAG Diagram -->
  <g transform="translate(560, 48)">
    <!-- Subtle Blueprint Container Frame -->
    <rect width="320" height="135" rx="5" fill="#0d1117" stroke="#21262d" stroke-width="0.8"/>
    <text x="12" y="18" class="mono-meta">EXECUTION_GRAPH :: TOPOLOGY</text>

    <!-- Node 1: Ingestion / Telemetry -->
    <rect x="16" y="32" width="80" height="30" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <text x="24" y="51" class="node-text">Ingest.io</text>

    <!-- Connecting Path 1 -> 2 -->
    <path d="M 96 47 L 126 47" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="2 2"/>
    <circle cx="126" cy="47" r="2" fill="#10b981"/>

    <!-- Node 2: Neural DAG Core -->
    <rect x="130" y="32" width="86" height="30" rx="3" fill="#161b22" stroke="#10b981" stroke-width="1"/>
    <text x="140" y="51" class="node-text" fill="#10b981">DAG Core</text>

    <!-- Branch Paths from Core -->
    <!-- Branch A: State Machine (Top) -->
    <path d="M 216 42 L 236 42 L 236 32 L 246 32" fill="none" stroke="#38bdf8" stroke-width="0.8"/>
    <rect x="246" y="20" width="62" height="24" rx="3" fill="#161b22" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="254" y="36" class="node-text" fill="#38bdf8">State</text>

    <!-- Branch B: Vector Memory (Bottom) -->
    <path d="M 216 52 L 236 52 L 236 72 L 246 72" fill="none" stroke="#8b5cf6" stroke-width="0.8"/>
    <rect x="246" y="60" width="62" height="24" rx="3" fill="#161b22" stroke="#8b5cf6" stroke-width="0.8"/>
    <text x="254" y="76" class="node-text" fill="#a78bfa">Vector</text>

    <!-- Node 3: Deterministic Actor (Lower) -->
    <rect x="16" y="80" width="80" height="30" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <text x="24" y="99" class="node-text">P2P Mesh</text>

    <!-- Connect 3 -> Core -->
    <path d="M 96 95 L 140 95 L 140 62" fill="none" stroke="#484f58" stroke-width="0.8"/>

    <!-- Lower Status Metrics in Frame -->
    <line x1="12" y1="116" x2="308" y2="116" stroke="#21262d" stroke-width="0.8"/>
    <text x="14" y="127" class="mono-meta">P99: 4.2ms · MEM: BOUNDED · ZERO_CLOUD: TRUE</text>
  </g>
</svg>
