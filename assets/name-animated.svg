<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 108" width="100%">
  <defs>
    <!-- Warm crimson-to-gold gradient matching the sunrise palette -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f0f4f8"/>
      <stop offset="55%"  stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#c9444a" stop-opacity="0.85"/>
    </linearGradient>

    <style>
      /* Slide-up fade for name */
      .nm {
        animation: slideUp 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      /* Delayed slide-up for role line */
      .rl {
        animation: slideUp 0.85s 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      /* Underline draws left-to-right */
      .ul {
        stroke-dasharray: 350;
        stroke-dashoffset: 350;
        animation: drawLine 0.75s 0.6s ease both;
      }
      /* Blinking cursor, starts after underline finishes */
      .cur {
        opacity: 0;
        animation: blink 1.1s 1.4s step-end infinite both;
      }
      /* Subtle status dot pulse */
      .dot {
        animation: pulse 2.5s 1.8s ease-in-out infinite both;
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0);   }
      }
      @keyframes drawLine {
        from { stroke-dashoffset: 350; }
        to   { stroke-dashoffset: 0;   }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1;   r: 4; }
        50%      { opacity: 0.5; r: 5; }
      }
    </style>
  </defs>

  <!-- ── NAME ──────────────────────────────────────────────── -->
  <text class="nm"
    x="0" y="54"
    font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="50" font-weight="700" letter-spacing="-1.5"
    fill="url(#nameGrad)">Deepak Jadhav</text>

  <!-- Animated crimson underline -->
  <line class="ul"
    x1="1" y1="64" x2="351" y2="64"
    stroke="#c9444a" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>

  <!-- Blinking text cursor -->
  <rect class="cur"
    x="358" y="30" width="2.5" height="30" rx="1"
    fill="#c9444a"/>

  <!-- ── ROLE ───────────────────────────────────────────────── -->
  <text class="rl"
    x="1" y="90"
    font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="16" font-weight="400" letter-spacing="0.5"
    fill="#8b949e">AI &amp; Backend Engineer &nbsp;·&nbsp; Pune, India</text>

  <!-- ── ACTIVE DOT ─────────────────────────────────────────── -->
  <circle class="dot" cx="4" cy="102" r="4" fill="#22c55e"/>
  <text
    x="14" y="106"
    font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
    font-size="12" font-weight="400" fill="#6e7681">
    Open to AI/ML Engineering · Backend · Software Engineering roles
  </text>
</svg>
