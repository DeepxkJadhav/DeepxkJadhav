          <text x="53.00" y="15.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Fira Code', monospace" font-size="11" font-weight="500" fill="#fda4af">TypeScript</text>
        </g>

        <g transform="translate(455.0, 94)">
