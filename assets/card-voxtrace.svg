<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 132" width="100%">
  <defs>
    <linearGradient id="card-grad-voxtrace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f1c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0710" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow-voxtrace" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Card with soft rounded corners and subtle ambient glow -->
  <rect x="2" y="2" width="876" height="128" rx="10" fill="url(#card-grad-voxtrace)" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Left Accent Bar -->
  <rect x="2" y="16" width="4" height="100" rx="2" fill="#f59e0b"/>

  <!-- Category & ID Tag -->
  <text x="32" y="32" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#f59e0b">06 / AUDIO SEARCH & MEMORY</text>

  <!-- Title & External Arrow -->
  <text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="-0.3" fill="#f8fafc">VoxTrace <tspan fill="#f59e0b" font-size="17">↗</tspan></text>

  <!-- Description -->
  <text x="32" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Searchable audio memory system with timestamped Whisper transcription and sub-second dense vector similarity retrieval.</text>

  <!-- Tags -->
  
