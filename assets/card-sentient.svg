<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 136" width="100%">
  <defs>
    <linearGradient id="card-grad-sentient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141022" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#0f0c1a" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1.0"/>
    </linearGradient>
    <filter id="glow-sentient" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Ambient Card Container -->
  <rect x="2" y="2" width="876" height="132" rx="12" fill="url(#card-grad-sentient)" stroke="#a855f7" stroke-opacity="0.25" stroke-width="1" filter="url(#glow-sentient)"/>

  <!-- Left Twilight Accent Pillar -->
  <rect x="2" y="18" width="4" height="100" rx="2" fill="#a855f7"/>

  <!-- Category & ID Tag -->
  <text x="32" y="32" font-family="'JetBrains Mono', Consolas, 'Fira Code', monospace" font-size="10.5" font-weight="600" letter-spacing="1.6" fill="#a855f7">05 // AUTONOMOUS MULTI-AGENT ORCHESTRATION</text>

  <!-- Title & External Arrow -->
  <text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="-0.2" fill="#f8fafc">Sentient-UI <tspan fill="#a855f7" font-size="17">↗</tspan></text>

  <!-- Verified Technical Description -->
  <text x="32" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Visual swarm orchestrator &amp; execution control plane for coding agent fleets with A* GOAP, BFT consensus &amp; MCP tool explorer.</text>

  <!-- Architecture / Stack Tags -->
  <g transform="translate(32.0, 94)">
    <rect width="84.0" height="24" rx="12" fill="rgba(168, 85, 247, 0.10)" stroke="#a855f7" stroke-opacity="0.28" stroke-width="1"/>
    <text x="42.0" y="15.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Fira Code', monospace" font-size="11" font-weight="500" fill="#e9d5ff">React 19</text>
  </g>

  <g transform="translate(126.0, 94)">
    <rect width="98.0" height="24" rx="12" fill="rgba(168, 85, 247, 0.10)" stroke="#a855f7" stroke-opacity="0.28" stroke-width="1"/>
    <text x="49.0" y="15.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Fira Code', monospace" font-size="11" font-weight="500" fill="#e9d5ff">TypeScript</text>
  </g>

  <g transform="translate(234.0, 94)">
    <rect width="112.0" height="24" rx="12" fill="rgba(168, 85, 247, 0.10)" stroke="#a855f7" stroke-opacity="0.28" stroke-width="1"/>
    <text x="56.0" y="15.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Fira Code', monospace" font-size="11" font-weight="500" fill="#e9d5ff">A* Planner</text>
  </g>

  <g transform="translate(356.0, 94)">
    <rect width="116.0" height="24" rx="12" fill="rgba(168, 85, 247, 0.10)" stroke="#a855f7" stroke-opacity="0.28" stroke-width="1"/>
    <text x="58.0" y="15.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Fira Code', monospace" font-size="11" font-weight="500" fill="#e9d5ff">BFT Consensus</text>
  </g>

  <g transform="translate(482.0, 94)">
    <rect width="92.0" height="24" rx="12" fill="rgba(168, 85, 247, 0.10)" stroke="#a855f7" stroke-opacity="0.28" stroke-width="1"/>
    <text x="46.0" y="15.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Fira Code', monospace" font-size="11" font-weight="500" fill="#e9d5ff">MCP 314+</text>
  </g>

  <g transform="translate(584.0, 94)">
    <rect width="68.0" height="24" rx="12" fill="rgba(168, 85, 247, 0.10)" stroke="#a855f7" stroke-opacity="0.28" stroke-width="1"/>
    <text x="34.0" y="15.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Fira Code', monospace" font-size="11" font-weight="500" fill="#e9d5ff">Vite</text>
  </g>
</svg>
