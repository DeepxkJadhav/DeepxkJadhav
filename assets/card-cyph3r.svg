<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 132" width="100%">
  <defs>
    <linearGradient id="card-grad-cyph3r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f1c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0710" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow-cyph3r" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Card with soft rounded corners and subtle ambient glow -->
  <rect x="2" y="2" width="876" height="128" rx="10" fill="url(#card-grad-cyph3r)" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>

