  <!-- Category & ID Tag -->
  <text x="32" y="32" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#38bdf8">03 / OSINT & GRAPH REASONING</text>

  <!-- Title & External Arrow -->
  <text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="-0.3" fill="#f8fafc">CYPH3R <tspan fill="#38bdf8" font-size="17">↗</tspan></text>

  <!-- Description -->
  <text x="32" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Open-source intelligence suite featuring automated entity relationship graphs, network topology, and visual feeds.</text>

