  <text x="32" y="32" font-family="'JetBrains Mono', Consolas, 'Fira Code', monospace" font-size="10.5" font-weight="600" letter-spacing="1.6" fill="#f43f5e">04 // COMPUTER VISION & OSINT GRAPH</text>

  <!-- Title & External Arrow -->
  <text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="-0.2" fill="#f8fafc">CYPH3R <tspan fill="#f43f5e" font-size="17">↗</tspan></text>

  <!-- Verified Technical Description -->
  <text x="32" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Visual OSINT entity intelligence platform extracting facial landmarks, building entity relationship graphs, and validating cryptographic hash integrity.</text>

