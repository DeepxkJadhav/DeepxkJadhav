<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 136" width="100%">
  <defs>
    <linearGradient id="card-grad-cyph3r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151020" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#0f0c18" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1.0"/>
    </linearGradient>
    <filter id="glow-cyph3r" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient Card Container -->
  <rect x="2" y="2" width="876" height="132" rx="12" fill="url(#card-grad-cyph3r)" stroke="#f43f5e" stroke-opacity="0.22" stroke-width="1" filter="url(#glow-cyph3r)"/>

