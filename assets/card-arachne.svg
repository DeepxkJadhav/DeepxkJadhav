  <text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="-0.2" fill="#f8fafc">Arachne <tspan fill="#f43f5e" font-size="17">↗</tspan></text>

  <!-- Verified Technical Description -->
  <text x="32" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Terminal-first research engine coordinating headless Chrome DevTools Protocol (CDP), source verification, structured dossiers, and SQLite WAL persistence.</text>

