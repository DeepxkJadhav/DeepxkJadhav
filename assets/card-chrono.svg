          <rect width="102.5" height="24" rx="12" fill="rgba(251, 113, 133, 0.12)" stroke="#fb7185" stroke-opacity="0.3" stroke-width="1"/>
          <text x="51.25" y="15" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#fb7185">VS Code API</text>
        </g>
</svg>