<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="45%" stop-color="#0a0f1d"/>
      <stop offset="85%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#030408"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-violet" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="flare-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Radial Hologram Spotlight -->
    <radialGradient id="holo-spot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="80%" stop-color="#3b82f6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Shading Gradients -->
    <linearGradient id="poly-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="poly-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="poly-grad-3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Anamorphic Lens Flare Beam -->
    <linearGradient id="anamorphic-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="25%" stop-color="#4facfe" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="75%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0"/>
    </linearGradient>

    <!-- HUD Grid Pattern -->
    <pattern id="hud-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.06"/>
      <circle cx="40" cy="40" r="0.8" fill="#818cf8" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    @keyframes spin3D {
      0% { transform: rotateY(0deg) rotateX(15deg) rotateZ(0deg); }
      50% { transform: rotateY(180deg) rotateX(-20deg) rotateZ(10deg); }
      100% { transform: rotateY(360deg) rotateX(15deg) rotateZ(0deg); }
    }

    @keyframes orbitClockwise {
      0% { transform: rotateZ(0deg); }
      100% { transform: rotateZ(360deg); }
    }

    @keyframes orbitCounter {
      0% { transform: rotateZ(360deg); }
      100% { transform: rotateZ(0deg); }
    }

    @keyframes pulseNeon {
      0%, 100% { opacity: 0.95; filter: drop-shadow(0 0 8px #06b6d4); }
      50% { opacity: 0.55; filter: drop-shadow(0 0 2px #06b6d4); }
    }

    @keyframes scanline {
      0% { transform: translateY(-40px); opacity: 0; }
      15% { opacity: 0.7; }
      85% { opacity: 0.7; }
      100% { transform: translateY(320px); opacity: 0; }
    }

    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .holo-core {
      transform-origin: 810px 170px;
      animation: spin3D 16s infinite linear;
      transform-style: preserve-3d;
    }

    .orbit-ring-1 {
      transform-origin: 810px 170px;
      animation: orbitClockwise 22s infinite linear;
    }

    .orbit-ring-2 {
      transform-origin: 810px 170px;
      animation: orbitCounter 15s infinite linear;
    }

    .scanner-beam {
      animation: scanline 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }

    .blinking-cursor {
      animation: blinkCursor 1s infinite;
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', 'Inter', sans-serif;
      font-weight: 900;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }

    .mono-telemetry {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      fill: #06b6d4;
    }

    .sub-telemetry {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      fill: #a5b4fc;
    }

    .desc-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14.5px;
      font-weight: 400;
      fill: #94a3b8;
      line-height: 1.6;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1000" height="340" rx="16" fill="url(#cyber-bg)"/>
  <rect width="1000" height="340" rx="16" fill="url(#hud-grid)"/>

  <!-- Subtle Outer Precision Border -->
  <rect width="998" height="338" x="1" y="1" rx="15" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1.2"/>

  <!-- Anamorphic Top Lens Flare -->
  <line x1="60" y1="2" x2="940" y2="2" stroke="url(#anamorphic-beam)" stroke-width="2.5" filter="url(#flare-glow)"/>

  <!-- Left Header Telemetry & Title -->
  <g transform="translate(56, 48)">
    <!-- HUD System Status -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="12" height="12" fill="none" stroke="#06b6d4" stroke-width="1.2"/>
      <circle cx="6" cy="6" r="3" fill="#10b981"/>
      <text x="22" y="10" class="mono-telemetry">CORE://DEEPAK.AI/NODE_V3.8 :: ONLINE</text>
      <text x="340" y="10" class="mono-telemetry" fill="#818cf8">[LATENCY: 0.08ms | STATE: DETERMINISTIC]</text>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="56" font-size="44" class="title-text">
      DEEPAK JADHAV
    </text>

    <!-- Role Subtitle -->
    <text x="0" y="86" class="sub-telemetry">
      NEURAL SYSTEMS ARCHITECT <tspan fill="#06b6d4">✦</tspan> 3D GRAPHICS &amp; AGENTS
    </text>

    <!-- Mission Pitch -->
    <text x="0" y="122" class="desc-text">
      Engineering autonomous agent swarms, living local-first computational DAGs,
    </text>
    <text x="0" y="144" class="desc-text">
      and real-time multimodal audio/visual intelligence pipelines.
    </text>

    <!-- Interactive 3D Portal Button Badge -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="235" height="38" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2" filter="url(#glow-cyan)"/>
      <rect x="2" y="2" width="231" height="34" rx="4" fill="#080e1a"/>
      <!-- Small 3D Cube Icon -->
      <g transform="translate(14, 11)">
        <polygon points="8,0 16,4 16,12 8,16 0,12 0,4" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
        <line x1="8" y1="0" x2="8" y2="8" stroke="#38bdf8" stroke-width="1"/>
        <line x1="8" y1="8" x2="16" y2="12" stroke="#38bdf8" stroke-width="1"/>
        <line x1="8" y1="8" x2="0" y2="12" stroke="#38bdf8" stroke-width="1"/>
      </g>
      <text x="38" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1px">
        ENTER 3D SHOWCASE ▶
      </text>
    </g>

    <!-- Secondary Spec Badge -->
    <g transform="translate(250, 180)">
      <rect x="0" y="0" width="180" height="38" rx="6" fill="#1e1b4b" fill-opacity="0.6" stroke="#6366f1" stroke-width="1"/>
      <text x="16" y="23" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#c7d2fe" letter-spacing="0.5px">
        #THREEJS #R3F #WEBGL
      </text>
    </g>

    <!-- Terminal Command Line Prompt -->
    <g transform="translate(0, 245)">
      <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#64748b">
        sys:~$ <tspan fill="#38bdf8">./render --fidelity=cinematic --model=hologram</tspan><tspan fill="#06b6d4" class="blinking-cursor">█</tspan>
      </text>
    </g>
  </g>

  <!-- RIGHT SIDE: CINEMATIC 3D HOLOGRAPHIC AVATAR / WIREFRAME CORE -->
  <g transform="translate(0, 0)">
    <!-- Radial Aura Spotlight Behind 3D Core -->
    <circle cx="810" cy="170" r="145" fill="url(#holo-spot)"/>

    <!-- HUD Targeting Crosshair Reticle -->
    <g stroke="#38bdf8" stroke-opacity="0.2" stroke-width="0.8" fill="none">
      <circle cx="810" cy="170" r="120"/>
      <circle cx="810" cy="170" r="140" stroke-dasharray="4 8"/>
      <line x1="810" y1="20" x2="810" y2="45"/>
      <line x1="810" y1="295" x2="810" y2="320"/>
      <line x1="660" y1="170" x2="685" y2="170"/>
      <line x1="935" y1="170" x2="960" y2="170"/>

      <!-- Corner HUD brackets -->
      <path d="M 690 60 L 670 60 L 670 80"/>
      <path d="M 930 60 L 950 60 L 950 80"/>
      <path d="M 690 280 L 670 280 L 670 260"/>
      <path d="M 930 280 L 950 280 L 950 260"/>
    </g>

    <!-- Outer Orbital Ring 1 (Rotates with Angled Projection) -->
    <g class="orbit-ring-1">
      <ellipse cx="810" cy="170" rx="128" ry="46" fill="none" stroke="#06b6d4" stroke-width="1.4" stroke-dasharray="32 14 8 14" opacity="0.85" filter="url(#glow-cyan)"/>
      <!-- Satellite Node on Ring 1 -->
      <circle cx="938" cy="170" r="3.5" fill="#38bdf8" filter="url(#glow-cyan)"/>
      <circle cx="682" cy="170" r="2.5" fill="#a855f7"/>
    </g>

    <!-- Outer Orbital Ring 2 (Counter Rotates at Complementary Inclination) -->
    <g class="orbit-ring-2">
      <ellipse cx="810" cy="170" rx="115" ry="54" fill="none" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="18 10 40 8" opacity="0.75" filter="url(#glow-violet)"/>
      <!-- Satellite Node on Ring 2 -->
      <circle cx="810" cy="116" r="3.5" fill="#ec4899" filter="url(#glow-violet)"/>
      <circle cx="810" cy="224" r="2.5" fill="#06b6d4"/>
    </g>

    <!-- 3D Polyhedral Hologram Core -->
    <!-- Front and Rear Isometric Wireframe Faces with Shaded Poly-Mesh -->
    <g class="holo-core">
      <!-- Polyhedron Face 1 (Top Left) -->
      <polygon points="810,95 745,135 810,170" fill="url(#poly-grad-1)" stroke="#38bdf8" stroke-width="1.2" opacity="0.85"/>
      <!-- Polyhedron Face 2 (Top Right) -->
      <polygon points="810,95 875,135 810,170" fill="url(#poly-grad-2)" stroke="#818cf8" stroke-width="1.2" opacity="0.8"/>
      <!-- Polyhedron Face 3 (Bottom Left) -->
      <polygon points="745,135 810,170 810,245" fill="url(#poly-grad-3)" stroke="#06b6d4" stroke-width="1.2" opacity="0.85"/>
      <!-- Polyhedron Face 4 (Bottom Right) -->
      <polygon points="875,135 810,170 810,245" fill="url(#poly-grad-1)" stroke="#a855f7" stroke-width="1.2" opacity="0.75"/>

      <!-- Outer 3D Vertices (Icosahedron Extension Points) -->
      <polygon points="810,95 725,170 745,135" fill="url(#poly-grad-2)" stroke="#38bdf8" stroke-width="0.9" opacity="0.6"/>
      <polygon points="810,95 895,170 875,135" fill="url(#poly-grad-3)" stroke="#818cf8" stroke-width="0.9" opacity="0.6"/>
      <polygon points="745,135 725,170 810,245" fill="url(#poly-grad-1)" stroke="#06b6d4" stroke-width="0.9" opacity="0.5"/>
      <polygon points="875,135 895,170 810,245" fill="url(#poly-grad-2)" stroke="#ec4899" stroke-width="0.9" opacity="0.5"/>

      <!-- Inner Holographic Energy Core Diamond -->
      <polygon points="810,135 845,170 810,205 775,170" fill="#ffffff" fill-opacity="0.3" stroke="#ffffff" stroke-width="1.5" filter="url(#glow-cyan)"/>

      <!-- Glowing Core Center Spark -->
      <circle cx="810" cy="170" r="5" fill="#ffffff" filter="url(#glow-cyan)"/>
      <circle cx="810" cy="170" r="1.5" fill="#06b6d4"/>
    </g>

    <!-- Vertical Sweeping Hologram Scan Laser Beam -->
    <g class="scanner-beam">
      <line x1="680" y1="0" x2="940" y2="0" stroke="#00f2fe" stroke-width="1.8" filter="url(#glow-cyan)"/>
      <rect x="680" y="-12" width="260" height="12" fill="url(#poly-grad-1)" opacity="0.25"/>
    </g>

    <!-- Holographic Telemetry Footnote -->
    <text x="810" y="318" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" letter-spacing="1px" opacity="0.8">
      HOLOGRAM MATRIX 3D :: ACTIVE
    </text>
  </g>
</svg>
